name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vehicle-backend
    env:
      # Throwaway value for CI only; it protects nothing.
      DJANGO_SECRET_KEY: ci-throwaway-key-not-a-real-secret
      # Debug stays off so CI runs with production settings, but the
      # runner only serves plain HTTP, so the HTTPS redirect is disabled.
      DJANGO_SECURE_SSL_REDIRECT: 'false'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt coverage

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: coverage run --source=api manage.py test api

      - name: Coverage report
        run: coverage report

      - name: Start server for functional tests
        env:
          # The smoke test logs in and registers more often than the
          # production limits allow within a minute; raise them for this run only.
          DJANGO_THROTTLE_TOKEN_RATE: 1000/min
          DJANGO_THROTTLE_REGISTER_RATE: 1000/hour
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ && break
            sleep 1
          done

      - name: Run functional smoke test
        run: python scripts/functional_smoke_test.py

  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
